<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF ハイライト エクスポーター</title>
    <!-- PDF.js は PdfViewer.jsx 内で CDN から動的 import します -->

    <!--
      GoatCounter（Cookieレス・プライバシー配慮・無料）でアクセス計測。
      使い方:
        1. https://www.goatcounter.com/ で無料登録（サイトコードを決める。例: shu-pdf）
        2. 下の YOUR_GOATCOUNTER_CODE を、決めたコードに差し替え
           （例: shu-pdf → https://shu-pdf.goatcounter.com/count）
        3. 再ビルド＆再デプロイ
      ※ コードがプレースホルダのままでも実害はありません（計測されないだけ）。
    -->
    <script
      data-goatcounter="https://shu7.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
